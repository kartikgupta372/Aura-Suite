<header id="topbar">
  <button class="icon-btn" id="sidebarToggle" title="Show / hide library (Ctrl+\)"><svg class="i"><use href="#i-sidebar"/></svg></button>
  <div class="brand"><span class="logo"><svg viewBox="0 0 24 24"><path d="M4 18c3-6 5.5-9 8-9s1 6 3.5 6S19 11 20 9"/></svg></span>Inkboard</div>
  <div id="tabs"></div>
  <button class="icon-btn" id="newTabBtn" title="New notebook (Ctrl+N)"><svg class="i"><use href="#i-plus"/></svg></button>
  <div class="spacer"></div>
  <div id="saveStatus"></div>
  <button class="icon-btn" id="exportBtn" title="Export (PNG / PDF)"><svg class="i"><use href="#i-export"/></svg></button>
  <button class="icon-btn" id="themeBtn" title="Light / dark"><svg class="i"><use href="#i-moon"/></svg></button>
  <button class="icon-btn" id="pagesToggle" title="Show / hide pages"><svg class="i"><use href="#i-pages"/></svg></button>
  <button class="icon-btn" id="settingsBtn" title="Settings"><svg class="i"><use href="#i-settings"/></svg></button>
</header>

<div id="main">
  <aside id="sidebar">
    <div class="side-head">
      <span class="title">Library</span>
      <button class="icon-btn" id="newNotebookBtn" title="New notebook"><svg class="i"><use href="#i-note-plus"/></svg></button>
      <button class="icon-btn" id="newFolderBtn" title="New folder"><svg class="i"><use href="#i-folder-plus"/></svg></button>
      <button class="icon-btn" id="libMenuBtn" title="More"><svg class="i"><use href="#i-more"/></svg></button>
    </div>
    <div class="lib-root"><svg class="i"><use href="#i-folder"/></svg><span id="libRootName"></span></div>
    <div class="search"><svg class="i"><use href="#i-search"/></svg><input id="libSearch" placeholder="Search notebooks"></div>
    <div id="tree"></div>
    <div class="side-foot">
      <button class="btn" id="openFileBtn"><svg class="i"><use href="#i-open"/></svg>Open…</button>
      <button class="btn" id="saveAsBtn" title="Save a copy anywhere (Ctrl+Shift+S)">Save as…</button>
    </div>
  </aside>

  <section id="workspace">
    <div id="stage" data-tool="pen">
      <canvas id="ink"></canvas>
      <div id="textLayer"></div>
      <canvas id="ui"></canvas>
    </div>

    <div id="dock" class="float no-board">
      <button class="tool" data-tool="select" title="Select (V)"><svg class="i"><use href="#i-select"/></svg></button>
      <button class="tool" data-tool="lasso" title="Lasso select (Q)"><svg class="i"><use href="#i-lasso"/></svg></button>
      <button class="tool" data-tool="hand" title="Pan (H, or hold Space)"><svg class="i"><use href="#i-hand"/></svg></button>
      <span class="sep"></span>
      <button class="tool" data-tool="pen" title="Pen (P)"><svg class="i"><use href="#i-pen"/></svg><span class="swatch-dot" id="penDot"></span></button>
      <button class="tool" data-tool="highlighter" title="Highlighter (M)"><svg class="i"><use href="#i-marker"/></svg><span class="swatch-dot" id="hlDot"></span></button>
      <button class="tool" data-tool="eraser" title="Eraser (E)"><svg class="i"><use href="#i-eraser"/></svg></button>
      <span class="sep"></span>
      <button class="tool" data-tool="text" title="Text box (T) — or double-click anywhere"><svg class="i"><use href="#i-text"/></svg></button>
      <button class="tool" data-tool="sticky" title="Sticky note (N)"><svg class="i"><use href="#i-sticky"/></svg></button>
      <button class="tool" data-tool="shape" title="Shapes (S)"><svg class="i" id="shapeIcon"><use href="#i-shapes"/></svg></button>
      <button class="tool" id="imageBtn" title="Insert image (or paste / drop)"><svg class="i"><use href="#i-image"/></svg></button>
      <button class="tool" data-tool="laser" title="Laser pointer (K)"><svg class="i"><use href="#i-laser"/></svg></button>
      <span class="sep"></span>
      <button class="tool" id="undoBtn" title="Undo (Ctrl+Z)"><svg class="i"><use href="#i-undo"/></svg></button>
      <button class="tool" id="redoBtn" title="Redo (Ctrl+Y)"><svg class="i"><use href="#i-redo"/></svg></button>
    </div>

    <div id="toolOptions" class="float no-board"></div>

    <div id="formatBar" class="float no-board hidden">
      <select class="fsel" id="fmtBlock" title="Paragraph style">
        <option value="div">Normal</option><option value="h1">Heading 1</option><option value="h2">Heading 2</option>
        <option value="h3">Heading 3</option><option value="blockquote">Quote</option><option value="pre">Code block</option>
      </select>
      <select class="fsel" id="fmtFont" title="Font">
        <option value="sans">Sans</option><option value="serif">Serif</option><option value="mono">Mono</option>
        <option value="hand">Handwriting</option><option value="print">Print hand</option>
      </select>
      <button class="fbtn" data-cmd="size-" title="Smaller (Ctrl+[)"><svg class="i"><use href="#i-minus"/></svg></button>
      <input class="fsize" id="fmtSize" title="Font size" value="16">
      <button class="fbtn" data-cmd="size+" title="Bigger (Ctrl+])"><svg class="i"><use href="#i-plus"/></svg></button>
      <span class="sep"></span>
      <button class="fbtn" data-cmd="bold" title="Bold (Ctrl+B)"><b>B</b></button>
      <button class="fbtn" data-cmd="italic" title="Italic (Ctrl+I)"><i>I</i></button>
      <button class="fbtn" data-cmd="underline" title="Underline (Ctrl+U)"><u>U</u></button>
      <button class="fbtn" data-cmd="strikeThrough" title="Strikethrough (Ctrl+Shift+X)"><s>S</s></button>
      <button class="fbtn" data-cmd="superscript" title="Superscript"><svg class="i"><use href="#i-sup"/></svg></button>
      <button class="fbtn" data-cmd="subscript" title="Subscript"><svg class="i"><use href="#i-sub"/></svg></button>
      <button class="fbtn color-btn" data-cmd="foreColor" title="Text colour"><svg class="i"><use href="#i-color"/></svg><span class="bar" id="foreBar" style="background:#dc2626"></span></button>
      <button class="fbtn color-btn" data-cmd="hiliteColor" title="Highlight"><svg class="i"><use href="#i-highlight"/></svg><span class="bar" id="hiliteBar" style="background:#fde047"></span></button>
      <span class="sep"></span>
      <button class="fbtn" data-cmd="justifyLeft" title="Align left (Ctrl+L)"><svg class="i"><use href="#i-al"/></svg></button>
      <button class="fbtn" data-cmd="justifyCenter" title="Center (Ctrl+E)"><svg class="i"><use href="#i-ac"/></svg></button>
      <button class="fbtn" data-cmd="justifyRight" title="Align right (Ctrl+R)"><svg class="i"><use href="#i-ar"/></svg></button>
      <button class="fbtn" data-cmd="justifyFull" title="Justify (Ctrl+J)"><svg class="i"><use href="#i-aj"/></svg></button>
      <span class="sep"></span>
      <button class="fbtn" data-cmd="insertUnorderedList" title="Bullets (Ctrl+Shift+8, or type “- ”)"><svg class="i"><use href="#i-list"/></svg></button>
      <button class="fbtn" data-cmd="insertOrderedList" title="Numbering (Ctrl+Shift+7, or type “1. ”)"><svg class="i"><use href="#i-list-ol"/></svg></button>
      <button class="fbtn" data-cmd="checklist" title="Checklist (Ctrl+Shift+9, or type “[] ”)"><svg class="i"><use href="#i-checklist"/></svg></button>
      <button class="fbtn" data-cmd="outdent" title="Decrease indent (Shift+Tab)"><svg class="i"><use href="#i-outdent"/></svg></button>
      <button class="fbtn" data-cmd="indent" title="Increase indent (Tab)"><svg class="i"><use href="#i-indent"/></svg></button>
      <span class="sep"></span>
      <button class="fbtn" data-cmd="link" title="Link (Ctrl+K)"><svg class="i"><use href="#i-link"/></svg></button>
      <button class="fbtn" data-cmd="table" title="Insert table"><svg class="i"><use href="#i-table"/></svg></button>
      <button class="fbtn" data-cmd="insertHorizontalRule" title="Divider (or type “--- ”)"><svg class="i"><use href="#i-hr"/></svg></button>
      <button class="fbtn" data-cmd="removeFormat" title="Clear formatting (Ctrl+\)"><svg class="i"><use href="#i-clear"/></svg></button>
      <span id="tableOps" class="hidden" style="display:flex;gap:2px;align-items:center">
        <span class="sep"></span>
        <button class="fbtn" data-cmd="row-below" title="Add row below">+Row</button>
        <button class="fbtn" data-cmd="col-right" title="Add column right">+Col</button>
        <button class="fbtn" data-cmd="del-row" title="Delete row">−Row</button>
        <button class="fbtn" data-cmd="del-col" title="Delete column">−Col</button>
      </span>
      <span id="linkBox" class="hidden"><input id="linkInput" placeholder="Paste or type a link, then Enter"></span>
      <span class="sep"></span>
      <span id="fmtWords"></span>
      <button class="fbtn" data-cmd="done" title="Done (Esc)" style="padding:0 10px;color:var(--accent-ink);font-weight:600">Done</button>
    </div>

    <div id="selBar" class="float no-board hidden"></div>

    <div id="findBar" class="float no-board hidden">
      <div class="row">
        <input id="findInput" placeholder="Find on this page">
        <span id="findCount"></span>
        <button class="icon-btn" id="findPrev" title="Previous (Shift+Enter)"><svg class="i" style="transform:rotate(180deg)"><use href="#i-down"/></svg></button>
        <button class="icon-btn" id="findNext" title="Next (Enter)"><svg class="i"><use href="#i-down"/></svg></button>
        <button class="icon-btn" id="findClose" title="Close (Esc)"><svg class="i"><use href="#i-x"/></svg></button>
      </div>
      <div class="row" id="replaceRow">
        <input id="replaceInput" placeholder="Replace with">
        <button class="btn" id="replaceOne">Replace</button>
        <button class="btn" id="replaceAll">All</button>
      </div>
    </div>

    <div id="zoomBar" class="float no-board">
      <button class="fbtn" id="zoomOut" title="Zoom out (Ctrl+-)"><svg class="i"><use href="#i-minus"/></svg></button>
      <button id="zoomLabel" title="Zoom options">100%</button>
      <button class="fbtn" id="zoomIn" title="Zoom in (Ctrl+=)"><svg class="i"><use href="#i-plus"/></svg></button>
      <button class="fbtn" id="zoomFit" title="Fit everything (Shift+1)"><svg class="i"><use href="#i-fit"/></svg></button>
      <span class="sep"></span>
      <button class="fbtn" id="pageStyleBtn" title="Page background"><svg class="i"><use href="#i-grid"/></svg></button>
    </div>

    <div id="hwChip" class="float no-board">
      <button class="fbtn" id="hwBtn" title="Handwriting assistant"><svg class="i"><use href="#i-sparkle"/></svg><span>Handwriting:</span><span class="state" id="hwState">Neaten</span><svg class="i" style="width:14px;height:14px"><use href="#i-down"/></svg></button>
    </div>

    <div id="emptyState" class="hidden">
      <div class="card">
        <svg class="i" style="width:44px;height:44px;color:var(--accent)"><use href="#i-notebook"/></svg>
        <h2>No notebook open</h2>
        <div>Pick one from your library on the left, or start a fresh one. Everything saves straight into your folders.</div>
        <div class="row">
          <button class="btn primary" id="emptyNew"><svg class="i"><use href="#i-plus"/></svg>New notebook</button>
          <button class="btn" id="emptyOpen"><svg class="i"><use href="#i-open"/></svg>Open…</button>
        </div>
      </div>
    </div>
  </section>

  <aside id="pagesPanel">
    <div class="pages-head">
      <span class="title">Pages</span>
      <button class="icon-btn" id="addPageBtn" title="New page (Ctrl+Shift+N)"><svg class="i"><use href="#i-plus"/></svg></button>
    </div>
    <div id="pageList"></div>
  </aside>
</div>

<div id="toasts"></div>
<script type="module" src="app.js"></script>
</body>
</html>

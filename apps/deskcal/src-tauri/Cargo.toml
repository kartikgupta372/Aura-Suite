[package]
name = "deskcal"
version = "1.0.0"
description = "DeskCal - a calendar that reminds you, by Aura Suite"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-notification = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
serde_json = "1"

[profile.release]
lto = true
opt-level = "s"
strip = true

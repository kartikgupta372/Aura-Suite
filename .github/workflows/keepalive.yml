# Supabase pauses free projects after 7 days without activity. This runs a real query against
# each database twice a day so neither project is ever paused. GitHub disables schedules in repos
# with no commits for 60 days; if that happens, press "Enable workflow" in the Actions tab.
name: Keep databases awake
on:
  schedule:
    - cron: '17 3,15 * * *'
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: aura-suite (waitlist, accounts, Speak, BeatBeater, SponsorFit, Codex)
        run: |
          curl -fsS -o /dev/null -w "aura-suite %{http_code}\n" \
            "https://grmaprevhcrjrlstssfi.supabase.co/rest/v1/kits?select=slug&limit=1" \
            -H "apikey: sb_publishable_e8GiA8jFIsTEWGs9vQ0j_Q_2uMo9FBo"
      - name: AuraDesignAI (through the Aura Design backend health check, which queries the database)
        run: curl -fsS -m 60 -w "\naura-design %{http_code}\n" https://aura-design-ai-gilt.vercel.app/health/ready

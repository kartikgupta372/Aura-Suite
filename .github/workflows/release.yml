# Builds both Windows installers and publishes them as a GitHub Release.
# Trigger: push a tag like v1.0.0  (git tag v1.0.0 && git push origin v1.0.0), or run it by hand from the Actions tab.
# The hub site links to releases/latest/download/<name>, so the file names below must not change.
name: Release desktop apps
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  inkboard:
    runs-on: windows-latest
    defaults: { run: { working-directory: apps/inkboard } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: apps/inkboard/package-lock.json }
      - run: npm ci --no-audit --no-fund
      - run: npx --yes electron-builder@26 --win nsis --x64 --publish never
      - run: Copy-Item dist/Inkboard-Setup-*.exe Inkboard-Setup.exe
        shell: pwsh
      - uses: actions/upload-artifact@v4
        with: { name: inkboard, path: apps/inkboard/Inkboard-Setup.exe }
  deskcal:
    runs-on: windows-latest
    defaults: { run: { working-directory: apps/deskcal } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with: { workspaces: apps/deskcal/src-tauri }
      - run: npx --yes @tauri-apps/cli@2 icon ui/icon.svg
      - run: npx --yes @tauri-apps/cli@2 build
      - run: Copy-Item src-tauri/target/release/bundle/nsis/*-setup.exe DeskCal-Setup.exe
        shell: pwsh
      - uses: actions/upload-artifact@v4
        with: { name: deskcal, path: apps/deskcal/DeskCal-Setup.exe }
  publish:
    needs: [inkboard, deskcal]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: out, merge-multiple: true }
      - run: cd out && sha256sum *.exe > SHA256SUMS.txt && cat SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            out/Inkboard-Setup.exe
            out/DeskCal-Setup.exe
            out/SHA256SUMS.txt
          generate_release_notes: true
